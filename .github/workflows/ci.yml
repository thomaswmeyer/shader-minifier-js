# Two jobs. `test` typechecks, builds and runs everything that needs no browser, goldens included,
# in about a minute; `browser` installs Chromium and runs the semantic tests (test/pixels.test.ts,
# test/corpus.test.ts, test/half.test.ts and the ANGLE ones), about ten minutes. They run side by
# side, so the goldens' verdict does not wait for the renders.
#
# The semantic tests skip themselves when no browser can be launched, which keeps them optional
# for a contributor who has not installed Chromium. That would make CI green while testing
# nothing, so REQUIRE_BROWSER turns a missing browser into a failure here.
#
# Every branch runs, not only master: a repository ruleset requires the `test` check on any commit
# reaching master, and the check belongs to the commit, so a branch commit that passed here can be
# fast-forwarded onto master without a pull request. The same commit runs once more when it lands
# on master, which costs runner minutes and nothing else. Requiring `browser` as well is a
# repository setting.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:fast

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # ANGLE compiled to wasm: a second front end for the output, and the competitor in
      # `npm run metrics`. Optional, and its tests skip without it, so a registry hiccup is not a
      # build failure.
      - run: npm install --no-save spglsl
        continue-on-error: true
      - run: npm run test:browser
        env:
          REQUIRE_BROWSER: "1"
